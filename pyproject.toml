[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "factorypulse"
version = "0.1.0"
description = "Real-Time Predictive Maintenance & Equipment Intelligence Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "MaintenAITeam"},
]

dependencies = [
    # --- Core ---
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "python-dotenv>=1.0",

    # --- API ---
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",

    # --- Redis ---
    "redis[hiredis]>=5.0",

    # --- ML / Data Science ---
    "numpy>=1.26,<2.0",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "xgboost>=2.0",
    "lightgbm>=4.2",
    "shap>=0.44",
    "imbalanced-learn>=0.12",

    # --- Deep Learning ---
    "torch>=2.2",

    # --- MLOps ---
    "mlflow>=2.10",
    "dvc>=3.40",

    # --- RAG / Embeddings ---
    "sentence-transformers>=2.5",
    "qdrant-client>=1.7",
    "langchain-core>=0.3",
    "langchain-community>=0.3",

    # --- Agent ---
    "langgraph>=0.2.70",


    # --- Observability ---
    "prometheus-client>=0.20",
    "structlog>=24.1",

    # --- MQTT (Simulator) ---
    "paho-mqtt>=2.0",

    # --- Utilities ---
    "rich>=13.7",
    "click>=8.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "locust>=2.23",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
]

[project.scripts]
MaintenAI= "factorypulse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "factorypulse*",
    "services*",
    "ml*",
    "rag*",
    "agents*",
]

# --- Ruff (Linting & Formatting) ---
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = ["E501", "N803", "N806", "TC001", "TC002", "TC003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["factorypulse", "services", "ml", "rag", "agents"]

# --- MyPy ---
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "xgboost.*",
    "lightgbm.*",
    "mlflow.*",
    "shap.*",
    "qdrant_client.*",
    "paho.*",
    "sklearn.*",
    "scipy.*",
    "imblearn.*",
]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require infrastructure)",
    "ml: ML model tests",
    "rag: RAG pipeline tests",
    "api: API endpoint tests",
    "e2e: End-to-end tests",
    "slow: Slow tests (model training, etc.)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["factorypulse", "services", "ml", "rag", "agents"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
