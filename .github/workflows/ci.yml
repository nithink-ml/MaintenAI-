name: MaintenAICI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-python:
    name: Test Python Core, ML & Security Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov pytest-mock ruff mypy bandit

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Bandit Security Scanner
        run: bandit -r MaintenAIservices ml rag agents -ll

      - name: Run Full Pytest Suite
        run: python -m pytest tests/ -v --tb=short

  build-frontend:
    name: Lint & Build Next.js Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: apps/frontend
        run: npm run lint

      - name: Build Next.js Production Bundle
        working-directory: apps/frontend
        run: npm run build

  validate-docker:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose File
        run: |
          cp .env.example .env
          docker compose config
